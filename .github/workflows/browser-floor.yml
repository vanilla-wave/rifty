name: Browser floor — record only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: |
          pnpm --filter @riftydev/playground dev:no-coi > /tmp/floor-host.log 2>&1 &
          node --input-type=module -e 'for (let n=0;n<90;n++){try {if((await fetch("http://127.0.0.1:5411/browser-support.html")).ok) process.exit(0)} catch {} await new Promise(r=>setTimeout(r,1000))} process.exit(1)'
      - run: node tools/floor-lane/run.mjs --engine ${{ matrix.engine }} --output floor-result.json
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: floor-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            floor-result.json
            /tmp/floor-host.log
