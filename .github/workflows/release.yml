name: Release

# Publishes all 15 @riftydev/* libraries (incl. sdk + workbench) to npm when a
# vX.Y.Z tag is pushed — TOKENLESS via npm OIDC trusted publishing (ADR-0070,
# ADR-0071, ADR-0224). There is NO NPM_TOKEN / NODE_AUTH_TOKEN secret anywhere.
#
# One-time prerequisites (out of repo — see docs/PUBLISHING.md):
#   1. Own the `@riftydev` org/scope on npmjs.com and bootstrap-publish each of the
#      15 names ONCE with a token (OIDC can't create a brand-new name — npm/cli
#      #8544). After that, every release is tokenless.
#   2. Add a GitHub Actions trusted publisher to EACH of the 15 packages on
#      npmjs.com: owner = vanilla-wave, repository = rifty, workflow = release.yml
#      (case-sensitive; no environment).
#   3. The repo must be PUBLIC for npm provenance to be emitted.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # GitHub-hosted runner required; self-hosted unsupported
    permissions:
      contents: read
      id-token: write # OIDC — load-bearing; without it trusted publishing is skipped
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json `packageManager` (pnpm 11.5.2).
      # MUST be >= 11.1.3: pnpm 11.0.x (incl. the old 11.0.8 pin) hit pnpm#11513
      # and 404 on OIDC publish.
      - uses: pnpm/action-setup@v4

      # NOTE: deliberately NO `registry-url` and NO `cache: pnpm`. `registry-url`
      # makes setup-node write an .npmrc with //registry.npmjs.org/:_authToken=
      # ${NODE_AUTH_TOKEN}; with the var unset (the point of tokenless OIDC) that
      # placeholder fights the OIDC fallback. Omitting it removes the failure mode
      # entirely — the OIDC exchange does not depend on setup-node's registry-url.
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ≥ npm OIDC minimum 22.14.0; matches engines >=24

      # GitHub runners ship npm below the 11.5.1 OIDC floor — upgrade it.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Derive version from tag
        run: echo "RIFTY_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set package versions to the tag
        run: >-
          pnpm -r --filter "./packages/*" --filter "@riftydev/shadow-registry"
          exec npm version "$RIFTY_VERSION" --no-git-tag-version --allow-same-version

      - name: Build libraries
        run: pnpm build:libs

      - name: Bundle LICENSE into each package
        run: |
          for d in packages/*/ tools/shadow-registry/; do
            cp LICENSE "$d/LICENSE"
          done

      # Publishes ONLY ./packages/* (incl. the umbrella `@riftydev/sdk`) + @riftydev/shadow-
      # registry — never a bare `pnpm -r publish`, which would also pick up the
      # non-private integration fixtures under tests/ and tools/. pnpm rewrites
      # workspace:* to the tag version (createExportableManifest, BEFORE the OIDC
      # handshake) and applies each package's publishConfig (dist exports). No
      # NODE_AUTH_TOKEN: pnpm detects the OIDC env and mints a short-lived token
      # itself; --provenance attests the build (needs this repo to be public).
      - name: Publish to npm (OIDC trusted publishing)
        run: >-
          pnpm -r --filter "./packages/*" --filter "@riftydev/shadow-registry"
          publish --access public --no-git-checks --provenance
