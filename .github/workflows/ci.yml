name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download on EVERY install — it's
        # uncached + externally-variable (CDN), the dominant CI cost. With the
        # `--with-deps` apt dropped from the root postinstall, this env makes
        # postinstall a true no-op. lint/unit need no browser; the e2e job installs
        # chromium (with apt deps) via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:libs # publish build must stay green (ADR-0070)
      - run: pnpm check:arch # layer direction + cycles + foreign-internal + solid (D-002)
      - run: pnpm check:parity-coverage
      - run: pnpm check:e2e-coverage
      - run: node tools/backlog/check.mjs # blocking: frontmatter + TODO(backlog:) integrity
      - run: node tools/refs/check.mjs # blocking: ADR index + cross-ref integrity

  unit-and-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download on EVERY install — it's
        # uncached + externally-variable (CDN), the dominant CI cost. With the
        # `--with-deps` apt dropped from the root postinstall, this env makes
        # postinstall a true no-op. lint/unit need no browser; the e2e job installs
        # chromium (with apt deps) via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm test:run
      - run: pnpm test:parity

  e2e-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download on EVERY install — it's
        # uncached + externally-variable (CDN), the dominant CI cost. With the
        # `--with-deps` apt dropped from the root postinstall, this env makes
        # postinstall a true no-op. lint/unit need no browser; the e2e job installs
        # chromium (with apt deps) via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Prod-artifact smoke: builds the app + serves it with `pnpm preview`
      # (Netlify COI headers) and asserts the owner boots. Catches prod-only
      # regressions the dev-server e2e above can't (green-checks-but-broken-deploy).
      - run: pnpm test:e2e:prod
      # Cold-start benchmark smoke (docs/backlog/perf/cold-start-and-install-benchmark).
      # Gates on the harness PRODUCING a well-formed artifact — cold-start measured,
      # the install number recorded (here `requires proxy`: no VITE_RIFTY_REGISTRY_URL
      # in CI) — NOT on absolute ms (wall-clock is noisy on shared CI; PB-6). One run
      # is enough to prove production; the committed launch figure is a local median.
      - name: Cold-start benchmark smoke
        run: |
          set -euo pipefail
          node tools/perf/bench.mjs --runs 1 --out /tmp/bench-ci.json
          node -e '
            const a = JSON.parse(require("node:fs").readFileSync("/tmp/bench-ci.json", "utf8"));
            const cold = a.metrics.coldStartToInteractiveMs;
            const install = a.metrics.npmInstallToFirstViteResponseMs;
            // Sanity, NOT a perf threshold (PB-6): a real measurement is a finite
            // positive ms — catches a silent 0/NaN, not a slow-but-honest number.
            if (cold.status !== "measured" || !Number.isFinite(cold.median) || cold.median <= 0) {
              throw new Error("cold-start not measured: " + JSON.stringify(cold));
            }
            if (!install.status) throw new Error("install metric not recorded (must never be silently skipped)");
            console.log(`bench artifact OK: cold median ${cold.median}ms, install=${install.status}`);
          '
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
