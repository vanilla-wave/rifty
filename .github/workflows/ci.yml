name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep the workflow unconditional: path-filtered required workflows remain
  # pending. Gate jobs instead, then reduce matrix results into `CI gate`.
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/checks/ci-change-scope.mjs "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # contract/goal gates need full baseline history
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download on EVERY install — it's
        # uncached + externally-variable (CDN), the dominant CI cost. With the
        # `--with-deps` apt dropped from the root postinstall, this env makes
        # postinstall a true no-op. lint/unit need no browser; the e2e job installs
        # chromium (with apt deps) via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:libs # publish build must stay green (ADR-0070)
      - run: pnpm check:arch # layer direction + cycles + foreign-internal + solid (D-002)
      - run: pnpm check:parity-coverage
      - run: pnpm check:e2e-coverage
      - run: pnpm check:compat-drift # docs-only PRs still prove generated compatibility claims
      - run: pnpm test:docs-contract # lightweight source↔compat/ADR honesty guards
      - run: pnpm check:shadow-catalog-drift
      - run: pnpm check:install-artifact-drift
      - run: pnpm check:snapshot-artifact-drift
      - run: pnpm check:sync-sha256-cores
      - run: pnpm check:source-grep # blocking: no new source-grep tests in playground unit + browser-unit (allowlist exact-match)
      - run: pnpm check:runtime-adapter-boundary # ADR-0308: generic admission/launch never branches on esbuild/Vite
      - run: pnpm check:esbuild-legacy-retirement # cutover: vendored ADR-0047 path cannot return
      - run: pnpm check:dir-owner # blocking: source dir > 30 direct prod modules carries an owner README
      - run: pnpm check:contract-drift # blocking: no in-place ready-contract edits in the same diff as source changes
      - run: pnpm check:pass-binding # blocking on a ready PR: product/test changes carry a landing verdict bound to an ancestor sha (REV-8); draft PRs skipped
      - run: pnpm backlog:check # blocking: frontmatter + TODO(backlog:) integrity
      - run: pnpm refs:check # blocking: ADR index + cross-ref integrity

  unit-and-conformance:
    needs: change-scope
    # bare needs.* implies success() and would skip the heavy suite when
    # change-scope dies; fail open to the full gate instead (ADR-0323 §2).
    if: ${{ !cancelled() && needs.change-scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # run + parity as parallel matrix jobs: wall-clock = max(suite), not sum
    # (test:run ~3m dominates; parity ~1m rides a second runner).
    strategy:
      fail-fast: false
      matrix:
        suite: [run, parity]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # committed perf provenance resolves measured + artifact commits
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0 # exact executable node-cli eval oracle
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download on EVERY install — it's
        # uncached + externally-variable (CDN), the dominant CI cost. With the
        # `--with-deps` apt dropped from the root postinstall, this env makes
        # postinstall a true no-op. lint/unit need no browser; the e2e job installs
        # chromium (with apt deps) via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm test:${{ matrix.suite }}

  e2e-chromium:
    needs: change-scope
    # bare needs.* implies success() and would skip the heavy suite when
    # change-scope dies; fail open to the full gate instead (ADR-0323 §2).
    if: ${{ !cancelled() && needs.change-scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Run the four lanes as PARALLEL matrix jobs (separate runners), not
    # sequential steps in one job: e2e wall-clock becomes max(lane) instead of
    # the sum. Separate runners also remove heavy<->light contention entirely
    # (the reason the old global workers=1 / same-job lane-split existed), so each
    # lane gets a dedicated machine.
    #
    # heavy/light are additionally SHARDED (`--shard=i/N`): each shard is its own
    # runner, still --workers=1 inside, so the proven one-cold-boot-per-machine
    # invariant is untouched — sharding only splits the serialized queue across
    # machines. Serial groups (ts-LS, project-management) travel whole into one
    # shard; the rest is already declared parallel-safe by fullyParallel.
    # Baseline that sized N: light 23.4m serial (107 tests, ~13s/test, no
    # dominating spec) → 8 shards ≈ 3m tests + ~1.5m setup; heavy 4.3m → 2.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: heavy, shard: 1, shardTotal: 2 }
          - { lane: heavy, shard: 2, shardTotal: 2 }
          - { lane: light, shard: 1, shardTotal: 8 }
          - { lane: light, shard: 2, shardTotal: 8 }
          - { lane: light, shard: 3, shardTotal: 8 }
          - { lane: light, shard: 4, shardTotal: 8 }
          - { lane: light, shard: 5, shardTotal: 8 }
          - { lane: light, shard: 6, shardTotal: 8 }
          - { lane: light, shard: 7, shardTotal: 8 }
          - { lane: light, shard: 8, shardTotal: 8 }
          - { lane: prod }
          - { lane: hosted }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0 # exact executable node-cli eval oracle
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download on EVERY install — it's
        # uncached + externally-variable (CDN), the dominant CI cost. With the
        # `--with-deps` apt dropped from the root postinstall, this env makes
        # postinstall a true no-op. lint/unit need no browser; the e2e job installs
        # chromium (with apt deps) via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Cache the browser binary keyed by the resolved Playwright version so a
      # version bump (lockfile) busts it but day-to-day runs skip the uncached,
      # CDN-variable download. On a cache hit NO apt runs at all: ubuntu-latest
      # ships Chrome, so chromium's shared libs are already on the image. The
      # old unconditional `install-deps` had a bimodal apt-mirror tail (11s p50,
      # 440s max across 12 parallel shards, run 30023071566) that dominated the
      # sharded wall-clock. If an image update ever drops a lib, the browser
      # launch fails loudly → restore an install-deps step.
      - id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # One lane per matrix job. heavy = serialized TS-LS/fullstack specs
      # (--workers=1); light = the rest; prod = prod-artifact smoke (builds the
      # app + `pnpm preview` with Netlify COI headers); hosted = the webpack
      # journey under a non-local HTTPS hostname, including stock HMR. The last
      # two catch production/deployment paths the localhost dev carrier cannot.
      #
      # light is serialized --workers=1 IN CI ONLY: on the shared CI runner, ≥2
      # dev-server specs cold-booting a Vite-WASI stack (owner + dev-server child +
      # Rolldown WASI pthread pool) concurrently starve the owner worker (0
      # emitChunk, ~15s owner-RPC timeout) → the readiness poll times out on a
      # random spec subset. Reproduced locally: --workers=16 → 16 fail, --workers=1
      # → all pass; the heavy lane already proves single-boot-at-a-time is reliable.
      # Local runs keep parallel (beefy machines don't oversubscribe). Re-enabling
      # light parallelism for speed needs the owner to survive concurrent boots.
      # (Sharding above sidesteps this: shards parallelize across machines, each
      # machine still boots one stack at a time.)
      - name: Packed Workbench consumer
        if: matrix.lane == 'light' && matrix.shard == 1
        run: pnpm test:packed-consumer
      - run: pnpm test:e2e:${{ matrix.lane }} ${{ matrix.lane == 'light' && '--workers=1' || '' }} ${{ matrix.shardTotal && format('--shard={0}/{1}', matrix.shard, matrix.shardTotal) || '' }}
      - name: Landing browser regression
        if: matrix.lane == 'prod'
        run: pnpm test:landing
      # Cold-start benchmark smoke (docs/backlog/perf/cold-start-and-install-benchmark).
      # Runs once, on the fast prod lane (chromium already installed above). Gates on
      # the harness PRODUCING a well-formed artifact — cold-start measured, the install
      # number recorded (here `requires proxy`: no VITE_RIFTY_REGISTRY_URL in CI) — NOT
      # on absolute ms (wall-clock is noisy on shared CI; PB-6). The committed launch
      # figure is a local median.
      - name: Cold-start benchmark smoke
        if: matrix.lane == 'prod'
        run: |
          set -euo pipefail
          node tools/perf/bench.mjs --runs 1 --presets project-files --out /tmp/bench-ci.json
          node -e '
            const a = JSON.parse(require("node:fs").readFileSync("/tmp/bench-ci.json", "utf8"));
            const cold = a.metrics.coldStartToInteractiveMs;
            const install = a.metrics.npmInstallToFirstViteResponseMs;
            // Sanity, NOT a perf threshold (PB-6): a real measurement is a finite
            // positive ms — catches a silent 0/NaN, not a slow-but-honest number.
            if (cold.status !== "measured" || !Number.isFinite(cold.median) || cold.median <= 0) {
              throw new Error("cold-start not measured: " + JSON.stringify(cold));
            }
            if (!install.status) throw new Error("install metric not recorded (must never be silently skipped)");
            // preset-boot (schema v2): one instant preset requested on a healthy
            // prod stack → it must MEASURE (an `unmeasured` here means the boot
            // broke, not noise; ms stays ungated per PB-6).
            const pb = a.metrics.presetBootToPreviewLiveMs;
            if (!Array.isArray(pb) || pb.length !== 1 || pb[0].status !== "measured"
                || !Number.isFinite(pb[0].median) || pb[0].median <= 0) {
              throw new Error("preset-boot not measured: " + JSON.stringify(pb));
            }
            // Stage attribution must be REAL for a vite preset: viteReadyMs went
            // silently null when PR #109 removed the rifty-authored ready line
            // (the bench honestly records null, so only this gate notices).
            const vr = pb[0].stages && pb[0].stages.viteReadyMs;
            if (!Number.isFinite(vr) || vr <= 0) {
              throw new Error("preset-boot viteReadyMs stage not attributed (ready-banner marker drifted?): " + JSON.stringify(pb[0].stages));
            }
            console.log(`bench artifact OK: cold median ${cold.median}ms, install=${install.status}, presetBoot[${pb[0].presetId}]=${pb[0].status}${pb[0].median ? ` ${pb[0].median}ms` : ""}`);
          '
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.lane }}${{ matrix.shardTotal && format('-{0}', matrix.shard) || '' }}
          path: playwright-report

  browser-unit-chromium:
    needs: change-scope
    # bare needs.* implies success() and would skip the heavy suite when
    # change-scope dies; fail open to the full gate instead (ADR-0323 §2).
    if: ${{ !cancelled() && needs.change-scope.outputs.code != 'false' }}
    # Browser-unit lane (ADR-0196): worker-side playground modules behaviorally
    # tested against the REAL owner worker under COI — thin harness page, no App
    # boot. Own job (not an e2e matrix lane): different tier, different config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
      # No install-deps on cache hit — see the e2e job's pw-cache comment.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # Serial by config (workers:1) — concurrent owner boots starve the owner
      # worker on shared runners (same reason chromium-light is serialized).
      - run: pnpm test:browser-unit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser-unit
          path: playwright-report

  no-coi-chromium:
    needs: change-scope
    if: ${{ !cancelled() && needs.change-scope.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:no-coi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-no-coi
          path: playwright-report/no-coi

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - change-scope
      - lint-and-typecheck
      - unit-and-conformance
      - e2e-chromium
      - browser-unit-chromium
      - no-coi-chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every applicable job
        env:
          CODE: ${{ needs.change-scope.outputs.code }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          UNIT_RESULT: ${{ needs.unit-and-conformance.result }}
          E2E_RESULT: ${{ needs.e2e-chromium.result }}
          BROWSER_UNIT_RESULT: ${{ needs.browser-unit-chromium.result }}
          NO_COI_RESULT: ${{ needs.no-coi-chromium.result }}
        run: node tools/checks/ci-gate.mjs
