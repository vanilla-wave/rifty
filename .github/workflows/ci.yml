name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download (chromium+firefox+webkit
        # + apt deps) on EVERY install — uncached, externally-variable, and the
        # dominant CI cost. lint/unit need no browser; the e2e job installs just
        # chromium via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:libs # publish build must stay green (ADR-0070)
      - run: pnpm check:arch # layer direction + cycles + foreign-internal + solid (D-002)
      - run: pnpm check:parity-coverage
      - run: pnpm check:e2e-coverage
      - run: node tools/backlog/check.mjs # blocking: frontmatter + TODO(backlog:) integrity
      - run: node tools/refs/check.mjs # blocking: ADR index + cross-ref integrity

  unit-and-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download (chromium+firefox+webkit
        # + apt deps) on EVERY install — uncached, externally-variable, and the
        # dominant CI cost. lint/unit need no browser; the e2e job installs just
        # chromium via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm test:run
      - run: pnpm test:parity

  e2e-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        # Skip the postinstall Playwright browser download (chromium+firefox+webkit
        # + apt deps) on EVERY install — uncached, externally-variable, and the
        # dominant CI cost. lint/unit need no browser; the e2e job installs just
        # chromium via the explicit step below. Mirrors netlify.toml.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Prod-artifact smoke: builds the app + serves it with `pnpm preview`
      # (Netlify COI headers) and asserts the owner boots. Catches prod-only
      # regressions the dev-server e2e above can't (green-checks-but-broken-deploy).
      - run: pnpm test:e2e:prod
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
