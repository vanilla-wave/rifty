# Netlify deploy config for the rifty playground.
#
# rifty MUST be served cross-origin-isolated (SharedArrayBuffer + Atomics.wait
# for sync IPC — D-001 / ADR-0002), which requires COOP/COEP response headers.
# Those are declared below AND in apps/playground/public/_headers (Vite copies
# it to dist/_headers); either alone is sufficient — both are kept so the dist
# stays self-describing if served outside Netlify.
#
# Deploys are automated from .github/workflows/netlify.yml.
# See docs/public/hosting-netlify.md.

[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "apps/playground/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.5.1"
  # The repo's postinstall runs `playwright install` (for local e2e). Skip the
  # ~400 MB browser download on the build box — Netlify never runs Playwright.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  # Monaco's worker bundle is memory-hungry under Vite/Rollup.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Registry base stays the relative `/npm-registry` default (ADR-0528): the
  # same-origin route below proxies it on Netlify, mirroring the Vite dev
  # proxy in apps/playground/vite.config.ts. The Yandex Cloud proxy/CDN
  # (`registry.rifty.dev`, ADR-0163) is out of service since 2026-10 and is
  # no longer a production dependency. VITE_RIFTY_RESOLVER_URL stays unset:
  # eddy (ADR-0182) ran on the same dead infrastructure; a configured dead
  # resolver costs every from-scratch install its header-stall timeout before
  # the standard path runs, so opt-in is OFF until a live resolver exists.
  # The workspace build includes the landing package even though this Netlify
  # site publishes only playground/dist. Keep its required public URL contract
  # explicit so the shared build cannot emit false SEO or navigation links.
  VITE_RIFTY_SITE_URL = "https://rifty.dev/"
  VITE_RIFTY_REPOSITORY_URL = "https://github.com/vanilla-wave/rifty"
  VITE_RIFTY_SDK_DOCS_URL = "https://github.com/vanilla-wave/rifty/tree/main/packages/rifty#readme"
  VITE_RIFTY_PLAYGROUND_URL = "https://play.rifty.dev/"

# Cross-origin isolation headers (mirror of apps/playground/public/_headers).
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "cross-origin"

# Same-origin npm registry route (ADR-0528; mirror of
# apps/playground/public/_redirects, which Netlify processes first). A 200
# rewrite to an external URL is a streaming proxy on Netlify's CDN: the browser
# never talks to registry.npmjs.org, so the cross-origin-isolated page needs no
# CORS/CORP from upstream. Must precede the SPA fallback or the shell would
# answer `/npm-registry/*` with HTML (the ADR-0133 incident).
[[redirects]]
  from = "/npm-registry/*"
  to = "https://registry.npmjs.org/:splat"
  status = 200

[[redirects]]
  from = "/npm-registry"
  to = "https://registry.npmjs.org/"
  status = 200

# Self-hosted fonts and the SW are real files in dist and are served directly;
# any other unmatched path falls back to the single-page app shell. (Netlify
# only applies a 200-rewrite when no static file matches, so /sw.js, /fonts/*,
# and hashed assets are unaffected.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
