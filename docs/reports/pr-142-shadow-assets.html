  &lt;section class=&quot;ra-section&quot; aria-labelledby=&quot;ra-changes-heading&quot;&gt;
    &lt;h2 class=&quot;ra-changes-title&quot; id=&quot;ra-changes-heading&quot;&gt;Реестр предложенных изменений&lt;/h2&gt;
    &lt;ol class=&quot;ra-changes&quot;&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ1&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Один owner-resident ShadowAssetManager.&lt;/strong&gt;
          &lt;p&gt;Owner создаёт и injects port; applied asset без manager loud-fails до tree publication.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ2&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Exit 0 только после verified readiness.&lt;/strong&gt;
          &lt;p&gt;Receipt различает persisted OPFS, best-effort OPFS и memory; два последних явно предупреждают.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ3&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Двухфазный tree/assets outcome.&lt;/strong&gt;
          &lt;p&gt;&lt;code&gt;ESHADOWASSET&lt;/code&gt; несёт &lt;code&gt;treeResult&lt;/code&gt; и typed cause; runtime read отдельно использует &lt;code&gt;ESHADOWASSETREAD&lt;/code&gt;.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ4&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;CAS действительно workspace-private.&lt;/strong&gt;
          &lt;p&gt;Raw sibling &lt;code&gt;/.rifty-private/workspaces/&amp;lt;slug&amp;gt;&lt;/code&gt; недоступен guest ancestor ops; explicit workspace-cache clear удаляет его.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ5&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Без eager GC в первой версии.&lt;/strong&gt;
          &lt;p&gt;Retention появится только с отдельным leases/generations contract.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ6&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Загружать exact applied/missing set.&lt;/strong&gt;
          &lt;p&gt;Нет трафика и quota pressure от ненужных бинарников; reuse планирует только по lockfile bytes, attested tree stamp.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ7&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;STD и Eddy — transport adapters manager.&lt;/strong&gt;
          &lt;p&gt;STD exact-resolves через active registry и сверяет manifest SRI; source, совпавший с override/trigger, rejected как &lt;code&gt;ESHADOWASSETSOURCE&lt;/code&gt;.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ8&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Lazy misses идут через async MessagePort.&lt;/strong&gt;
          &lt;p&gt;Named opaque capability передаётся один раз в kernel init до child import; Node IPC и 1MiB SAB RPC не используются.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ9&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Inspectable provenance receipt.&lt;/strong&gt;
          &lt;p&gt;Replacement, registry digest, source version, tarball SRI, member path/hash и cache result.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ10&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Verified publish с явным durability acknowledgement.&lt;/strong&gt;
          &lt;p&gt;SRI/member checks, size bounds и loud failure; контракт не привязан к недоступному atomic rename.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ11&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Trusted reuse аттестует exact lockfile bytes.&lt;/strong&gt;
          &lt;p&gt;&lt;code&gt;InstallStamp v3&lt;/code&gt; хранит lowercase sha256 exact &lt;code&gt;package-lock.json&lt;/code&gt; bytes; v2/missing/edited invalidates reuse до planning.&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;ra-change&quot;&gt;
        &lt;span class=&quot;ra-change-id&quot;&gt;Δ12&lt;/span&gt;
        &lt;div class=&quot;ra-change-body&quot;&gt;
          &lt;strong&gt;Remote catalog не активирует host adapter по имени.&lt;/strong&gt;
          &lt;p&gt;Нужен local allowlist exact catalog id+digest → adapter; overlay JS остаётся исполняемым guest code, не «inert data».&lt;/p&gt;
          &lt;span class=&quot;ra-change-status text-small&quot;&gt;ПРЕДЛОЖЕНО&lt;/span&gt;
        &lt;/div&gt;
      &lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;

  &lt;section class=&quot;ra-section&quot; aria-labelledby=&quot;ra-contract-heading&quot;&gt;
    &lt;h2 id=&quot;ra-contract-heading&quot;&gt;Контракт: исходный PR → recut&lt;/h2&gt;
    &lt;div class=&quot;ra-table-wrap&quot; role=&quot;region&quot; aria-label=&quot;Сравнение контрактов исходного PR и recut; таблица прокручивается по горизонтали на узком экране&quot; tabindex=&quot;0&quot;&gt;
      &lt;table class=&quot;ra-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;col&quot;&gt;Тема&lt;/th&gt;
            &lt;th scope=&quot;col&quot;&gt;Исходный PR&lt;/th&gt;
            &lt;th class=&quot;is-proposed&quot; scope=&quot;col&quot;&gt;Δ Предложено&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Install success&lt;/th&gt;
            &lt;td&gt;Background fill; asset failure не блокирует stamp/exit.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Await exact set receipt. Post-tree failure = &lt;code&gt;ESHADOWASSET&lt;/code&gt; + &lt;code&gt;treeResult&lt;/code&gt; + typed cause; shell stamps matching tree independently and exits non-zero.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Error surface&lt;/th&gt;
            &lt;td&gt;Install, integrity и lazy-read failures не образуют совместимую typed boundary.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Install wraps causes under &lt;code&gt;ESHADOWASSET&lt;/code&gt;; tarball mismatch keeps &lt;code&gt;cause.code=EINTEGRITY&lt;/code&gt;; runtime port returns &lt;code&gt;ESHADOWASSETREAD&lt;/code&gt;, port faults — typed cause.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;State owner&lt;/th&gt;
            &lt;td&gt;Install fill и lazy child fill делят путь без realm-wide authority.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Один &lt;code&gt;ShadowAssetManager&lt;/code&gt;; install — direct port, children — async MessagePort adapter.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Construction seam&lt;/th&gt;
            &lt;td&gt;Не определено, кто создаёт manager и как public &lt;code&gt;install()&lt;/code&gt; его получает.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Owner создаёт manager после backend boot; &lt;code&gt;InstallOptions.shadowAssets&lt;/code&gt; optional только для empty set, иначе pre-publication loud gap.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Storage scope&lt;/th&gt;
            &lt;td&gt;&lt;code&gt;/.rifty/shadow-assets&lt;/code&gt; назван workspace-local, хотя namespace profile-wide.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Raw sibling &lt;code&gt;/.rifty-private/workspaces/&amp;lt;slug&amp;gt;/…&lt;/code&gt;; guest root/ancestor ops не достигают его; explicit clear удаляет private root.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Storage claim&lt;/th&gt;
            &lt;td&gt;OPFS назван durable без учёта persistent-storage grant.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;&lt;code&gt;opfs-persisted&lt;/code&gt; / &lt;code&gt;opfs-best-effort&lt;/code&gt; / &lt;code&gt;memory-session&lt;/code&gt;; reload/eviction promise соответствует классу.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Child bytes&lt;/th&gt;
            &lt;td&gt;Guest &lt;code&gt;FsSync&lt;/code&gt;/lazy ensure не определяет owner-death bound и не помещает 13.3MiB в 1MiB SAB reply.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Owner starts one channel before spawn; generic named capability transfers exactly once in kernel init and publishes before entry; transferable bytes, size cap, progress/cancel/deadline/dispose.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Trust claim&lt;/th&gt;
            &lt;td&gt;Temp write + «atomic rename», которого OPFS persistence contract не даёт.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Flush/ack → publish → read-back hash → immutable receipt → ready pointer last. Любая torn chain = miss.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Retention&lt;/th&gt;
            &lt;td&gt;Sweep «non-pinned» при ensure/update без leases.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;No eager GC. Очистка только явная; shared CAS/GC требует leases + generations.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Eddy scope&lt;/th&gt;
            &lt;td&gt;Полный app-version-global каталог для каждого проекта.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Только exact missing assets реально applied substitutions; zero misses = zero transport.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Eddy source&lt;/th&gt;
            &lt;td&gt;Ordinary server install может применить baked override к package, который descriptor считал raw source.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Source не может match override/trigger: &lt;code&gt;ESHADOWASSETSOURCE&lt;/code&gt; до request; raw mode требует отдельного protocol ADR.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;STD resolution&lt;/th&gt;
            &lt;td&gt;Descriptor имеет name/version/SRI, но не определяет, откуда берётся обязательный &lt;code&gt;resolved&lt;/code&gt; tarball URL.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Tarball-cache by SRI first; miss exact-resolves через injected active registry/auth, сверяет manifest name/version/&lt;code&gt;dist.integrity&lt;/code&gt;, затем fetches &lt;code&gt;dist.tarball&lt;/code&gt;. URL не baked.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Identity&lt;/th&gt;
            &lt;td&gt;Pin меняет install-artifact identity и перелинкует дерево.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Отдельный required-set digest; pin-only update не пересобирает &lt;code&gt;node_modules&lt;/code&gt;.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Trusted reuse&lt;/th&gt;
            &lt;td&gt;План exact versions читает lockfile, который current tree stamp не аттестует.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;&lt;code&gt;InstallStamp v3.lockfileSha256&lt;/code&gt; аттестует exact bytes; v2/missing/edit mismatch отключает reuse и запускает normal install до asset planning.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Offline recovery&lt;/th&gt;
            &lt;td&gt;Очистка asset CAS при сохранённом tarball cache ошибочно ожидает failure.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;CAS clear + tarball retained = offline re-extract success; оба очищены = named loud failure.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Alias retirement&lt;/th&gt;
            &lt;td&gt;Asset trigger мог исчезнуть вместе с установленным alias package.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Synthetic public &lt;code&gt;esbuild@exact&lt;/code&gt; всегда emits applied-substitution + asset descriptor.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Sass&lt;/th&gt;
            &lt;td&gt;Следующий package выглядит обязующимся пройти тем же asset path.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Pure-JS/twin может не иметь assets; derived runtime использует manager только после API/lifecycle parity. До выбора нет hard blocker.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Extensibility&lt;/th&gt;
            &lt;td&gt;Shadow registry data выглядит способным обобщить runtime behavior.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Declarative catalog отдельно от trusted adapter registry. Remote adapter reference требует local binding exact catalog digest → capability; overlay JS исполняется как guest code и не называется inert.&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th scope=&quot;row&quot;&gt;Selective CI&lt;/th&gt;
            &lt;td&gt;Directory paths и любой root-lockfile change дают ложные skip/all.&lt;/td&gt;
            &lt;td class=&quot;is-proposed&quot;&gt;Transitive source closure + relevant lock importer/dependency closure; unknown input fails loud.&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;ra-section&quot; aria-labelledby=&quot;ra-proof-heading&quot;&gt;
    &lt;h2 id=&quot;ra-proof-heading&quot;&gt;Observable proof и UX&lt;/h2&gt;
    &lt;ul class=&quot;ra-proofs&quot;&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;&lt;code&gt;npm i &amp;amp;&amp;amp; vite&lt;/code&gt;&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Нет race: terminal показывает cache-check → fetch → verify → persist → ready.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Persisted OPFS · reload + offline&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;После clean flush dev/build/preview/optimize работают без asset network.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Best-effort OPFS&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Та же reload-проверка только пока origin storage сохранён; UI и receipt предупреждают об eviction.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;CAS удалён, tarball сохранён&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Offline re-extraction проходит успешно и делает zero network calls.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Оба cache miss&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Bounded named error: package, asset, phase, transports и recovery.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Quota / persist failure&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&lt;code&gt;ESHADOWASSET&lt;/code&gt; + non-zero без false receipt; matching package/tree не откатываются.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Concurrent children&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Один owner fill; все callers settle. Owner death не оставляет доверенного torn state.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;13.3MiB cross-realm&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Один transferable buffer через async port; deadline/cancel/dispose settle, SAB reply не участвует.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Capability handoff&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Owner serves port до spawn; kernel init transfers named port exactly once; bootstrap reads его до Vite import. Missing/failed init loud-fails.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Cold STD path&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Exact manifest через active registry; name/version/SRI drift rejected до adoption. Warm tarball cache делает zero packument calls.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Edited lockfile under stamp&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Digest mismatch отключает trusted reuse; normal install восстанавливает аттестованную tree/lockfile пару.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Private-root isolation&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Guest read/readdir/rm, &lt;code&gt;rm(&#x27;/&#x27;)&lt;/code&gt;, snapshot/export не видят sibling; explicit workspace-cache clear удаляет его.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Missing construction port&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Applied asset без manager loud-fails до tree publication; empty set остаётся inert.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Pin update&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Загружается только новый exact asset; старый object не удаляется; tree stamp reused.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Memory backend&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&lt;code&gt;memory-session&lt;/code&gt; warning; никакого offline-after-reload обещания.&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;ra-proof&quot;&gt;&lt;strong&gt;Remote catalog trust&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Чужой catalog id не включает локальный host adapter без exact digest binding; overlay provenance не выдаётся за sandbox.&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

  &lt;div class=&quot;ra-boundary-wrap&quot;&gt;
    &lt;aside class=&quot;card&quot; aria-label=&quot;Граница решения&quot;&gt;
      &lt;div class=&quot;ra-boundary-copy&quot;&gt;
        &lt;strong&gt;Граница решения: delivery only.&lt;/strong&gt;
        &lt;p&gt;Этот подход стандартизирует provenance и доставку bytes. Sass, SWC, sharp и другие библиотеки всё ещё требуют отдельных API/ABI/lifecycle parity contracts. Один owner гарантирован внутри вкладки; cross-tab workspace ownership остаётся отдельным явно записанным platform gap.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/aside&gt;
  &lt;/div&gt;
&lt;/section&gt;
