# The rifty.dev (Yandex Container-Optimized-Image VM) compose. COI PULLS images
# — it can't build the `build:` context — so this references the eddy image by
# `image:` (built + pushed to the registry; see docs/public/hosting-eddy.md).
# Unlike the local self-host compose, this deploy template also serves
# eddy-origin.rifty.dev for the CDN origin host. The checked-in file intentionally
# keeps the EDDY_S3_* group commented. The live rifty.dev VM uses a LOCAL
# secret-bearing copy passed via `--metadata-from-file`; never commit that copy.
services:
  eddy:
    image: cr.yandex/crpo6kvhb4o7gv41g0s4/eddy:0.2.2
    container_name: rifty-eddy
    restart: unless-stopped
    expose:
      - "8788"
    environment:
      # The server does not need the browser CORS proxy; the on-VM A/B measured
      # direct npmjs faster than the CDN proxy on cold resolves.
      REGISTRY_BASE_URL: "https://registry.npmjs.org"
      PORT: "8788"
      EDDY_TTL_SECONDS: "1800"
      # Bundle store: WITHOUT the EDDY_S3_* group below this boots the
      # byte-bounded MEMORY store (bundles die with the container) — the
      # stateless-origin story (ADR-0194 §4) holds only once an operator
      # provisions the bucket + key (hosting-eddy.md §Object-Storage) and
      # deploys a LOCAL copy of this file with the group filled in via
      # `--metadata-from-file`. The secret pair must NEVER be committed here.
      # EDDY_S3_ENDPOINT: "https://storage.yandexcloud.net"
      # EDDY_S3_BUCKET: "eddy-bundles"
      # EDDY_S3_REGION: "ru-central1"
      # EDDY_S3_ACCESS_KEY_ID: "<from `yc iam access-key create`>"
      # EDDY_S3_SECRET_ACCESS_KEY: "<from `yc iam access-key create`>"

  caddy:
    image: caddy:2.10.2-alpine
    container_name: rifty-eddy-caddy
    restart: unless-stopped
    depends_on:
      - eddy
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3: Caddy advertises h3 via alt-svc; QUIC needs UDP 443 published
      # here AND a `443/udp` ingress rule on the VM's security group (the
      # reused rifty-registry-proxy group has that rule live on rifty.dev).
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command:
      - /bin/sh
      - -c
      - |
        cat >/etc/caddy/Caddyfile <<'CADDY'
        {
          admin off
        }

        eddy.rifty.dev {
          reverse_proxy eddy:8788
        }

        # VM GET fallback host (ADR-0195): eddy-cdn.rifty.dev now fetches
        # bucket-backed GET-by-hash directly, but this host stays useful for
        # rollback and origin smoke tests. The edge refuses POST, so resolver
        # DNS always stays on eddy.rifty.dev.
        eddy-origin.rifty.dev {
          reverse_proxy eddy:8788
        }
        CADDY
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy_data:
  caddy_config:
