# @riftydev/eddy fast-install resolver (ADR-0182), deployed alongside the
# ADR-0163 registry proxy. Unlike the proxy (a stock Caddy image + inline
# config), eddy ships its own code, so this builds the image from source AND
# fronts it with Caddy for automatic HTTPS on eddy.rifty.dev (the proxy gets TLS
# the same way). eddy itself sets the cross-origin headers the browser client
# needs (services/eddy/src/server.ts); Caddy only terminates TLS + reverse-
# proxies, so those headers pass through unchanged (no duplication).
#
# This `build:` compose is for LOCAL self-host (`docker compose up` builds the
# image on the spot). A Yandex Container-Optimized-Image VM PULLS images — it
# does NOT build — so the rifty.dev deploy builds + pushes the image to a
# registry and swaps `build:` for `image: cr.yandex/<reg>/eddy:<tag>`; full
# procedure + the VM service-account (puller role) in docs/public/hosting-
# eddy.md. Caddy's automatic TLS needs the eddy.rifty.dev A record to resolve to
# the VM + ingress 80 (ACME HTTP-01) and 443 open BEFORE first boot. The actual
# deploy is a confirm-first step (operator-owned infra) — see
# docs/backlog/distribution/eddy-package-and-deploy.md.
services:
  eddy:
    build:
      # Build context is the repo root so the monorepo source is available.
      context: ../../..
      dockerfile: deploy/yandex/eddy/Dockerfile
    container_name: rifty-eddy
    restart: unless-stopped
    # No public port: only Caddy is exposed. Caddy reaches eddy as `eddy:8788`
    # on the compose network.
    expose:
      - "8788"
    environment:
      # Upstream registry eddy resolves against (D-004 env-config at the
      # server boundary). Point at the registry proxy so eddy + the proxy share
      # one upstream and the same trust boundary (ADR-0163).
      REGISTRY_BASE_URL: "https://registry.rifty.dev/npm-registry"
      PORT: "8788"
      # Mutable-tier TTL (seconds); 0 = always recompute. Immutable artifacts are
      # served Cache-Control: immutable for the CDN to hold.
      EDDY_TTL_SECONDS: "1800"

  caddy:
    image: caddy:2.10.2-alpine
    container_name: rifty-eddy-caddy
    restart: unless-stopped
    depends_on:
      - eddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command:
      - /bin/sh
      - -c
      - |
        cat >/etc/caddy/Caddyfile <<'CADDY'
        {
          admin off
        }

        eddy.rifty.dev {
          # eddy (server.ts) sets the CORS + Cross-Origin-Resource-Policy headers
          # the cross-origin browser client needs; Caddy only terminates TLS and
          # reverse-proxies, so those headers pass through unchanged.
          reverse_proxy eddy:8788
        }
        CADDY
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy_data:
  caddy_config:
