    <style>
      html {
        color-scheme: dark;
        background: #15171d;
      }

      body {
        margin: 0;
        background: #15171d;
        color: #f2f4f8;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .static-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 32px;
        box-sizing: border-box;
      }

      .static-shell-inner {
        width: min(100%, 1080px);
        border: 2px solid rgba(255, 255, 255, 0.16);
        padding: 40px;
        box-sizing: border-box;
      }

      .static-shell-brand,
      .static-shell-kicker,
      .static-shell-link {
        font-family: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }

      .static-shell-brand {
        display: inline-block;
        color: #fff;
        font-family: "Archivo Black", "Arial Black", Impact, sans-serif;
        font-size: 18px;
        text-decoration: none;
      }

      .static-shell-kicker {
        margin: 56px 0 22px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .static-shell h1 {
        max-width: 900px;
        margin: 0;
        font-family: "Archivo Black", "Arial Black", Impact, sans-serif;
        font-weight: 400;
        font-size: clamp(40px, 7vw, 72px);
        line-height: 0.98;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }

      .static-shell-accent {
        display: inline-block;
        padding: 0 14px;
        background: #c7f05a;
        color: #15170b;
      }

      .static-shell-copy {
        max-width: 460px;
        margin: 28px 0 34px;
        color: rgba(255, 255, 255, 0.62);
        font-size: 16px;
        line-height: 1.55;
      }

      .static-shell-link {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 0 24px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .static-shell-link:focus-visible {
        outline: 2px solid #c7f05a;
        outline-offset: 3px;
      }

      @media (max-width: 600px) {
        .static-shell {
          padding: 20px;
        }

        .static-shell-inner {
          padding: 24px 20px;
        }

        .static-shell-kicker {
          margin-top: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="main-content" class="static-shell" data-rifty-static-shell>
        <div class="static-shell-inner">
          <a class="static-shell-brand" href="__RIFTY_REPOSITORY_URL__">RIFTY</a>
          <p class="static-shell-kicker">Open runtime · Self-hostable</p>
          <h1>
            Node, npm &amp;<br />
            a dev server —<br />
            <span class="static-shell-accent">in a tab.</span>
          </h1>
          <p class="static-shell-copy">
            rifty is an open, self-hostable Node-compatible runtime and WASI runner for Chromium.
            Run tested Express 4, Vite 7, npm tooling and .wasm workflows — execution and files stay
            in the tab.
          </p>
          <a class="static-shell-link" href="__RIFTY_REPOSITORY_URL__">
            VIEW RIFTY ON GITHUB <span aria-hidden="true">↗</span>
          </a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
