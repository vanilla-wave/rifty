    <style>
      html {
        color-scheme: dark;
        background: #15171d;
      }

      body {
        margin: 0;
        background: #15171d;
        color: #fff;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .static-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 32px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 76% 20%, rgba(199, 240, 90, 0.09), transparent 31rem),
          #15171d;
      }

      .static-shell-inner {
        width: min(100%, 72rem);
      }

      .static-shell-brand,
      .static-shell-kicker {
        font-family: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }

      .static-shell-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }

      .static-shell-mark {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: #c7f05a;
        transform: rotate(45deg);
      }

      .static-shell-kicker {
        margin: 88px 0 18px;
        color: #c7f05a;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .static-shell h1 {
        max-width: 900px;
        margin: 0;
        font-size: clamp(42px, 7vw, 78px);
        line-height: 1.02;
        letter-spacing: -0.055em;
      }

      .static-shell-accent {
        color: #c7f05a;
      }

      .static-shell-copy {
        max-width: 680px;
        margin: 28px 0 34px;
        color: rgba(255, 255, 255, 0.65);
        font-size: clamp(17px, 2vw, 20px);
        line-height: 1.65;
      }

      .static-shell-link {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      .static-shell-link:focus-visible {
        outline: 2px solid #c7f05a;
        outline-offset: 3px;
      }

      @media (max-width: 600px) {
        .static-shell {
          padding: 28px 20px;
        }

        .static-shell-kicker {
          margin-top: 64px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="main-content" class="static-shell" data-rifty-static-shell>
        <div class="static-shell-inner">
          <a class="static-shell-brand" href="__RIFTY_REPOSITORY_URL__">
            <span class="static-shell-mark" aria-hidden="true"></span>
            rifty
          </a>
          <p class="static-shell-kicker">Open runtime · Self-hostable</p>
          <h1>
            Node, npm, and a dev server —
            <span class="static-shell-accent">inside a browser tab.</span>
          </h1>
          <p class="static-shell-copy">
            An open, MIT-licensed, self-hostable Node-compatible runtime and WASI runner for
            Chromium. Run tested Express, Vite 7, npm tooling, and real WASI binaries.
          </p>
          <a class="static-shell-link" href="__RIFTY_REPOSITORY_URL__">
            View rifty on GitHub
          </a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
