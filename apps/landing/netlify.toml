# Netlify deploy for the rifty.dev landing site (Vite static build).
#
# Built from the monorepo ROOT so the pnpm workspace resolves. Deliberately does
# NOT set COOP/COEP — those belong to the playground site (play.rifty.dev) only;
# the marketing page loads Google Fonts and needs no SharedArrayBuffer.
#
# Security headers + redirects live in public/_headers and public/_redirects so
# Vite copies them into dist/.

# CI (.github/workflows/netlify.yml) is the source of truth: it builds then
# deploys apps/landing/dist with --no-build. This block is the fallback for a
# Netlify-dashboard git build (base = apps/landing).
[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @riftydev/landing build"
  publish = "dist"
