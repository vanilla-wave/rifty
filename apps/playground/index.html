<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="rifty — a Node-compatible runtime and npm install, running entirely in your browser."
    />
    <title>rifty — playground</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <style>
      /* Critical, pre-bundle styles: avoid a white flash before theme.css
         (imported from the entry module) is injected by Vite. */
      :root {
        color-scheme: dark;
      }
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #131419;
        color: rgba(255, 255, 255, 0.9);
        font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        overflow: hidden;
      }
      * {
        box-sizing: border-box;
      }
      /* Cold-boot skeleton: paints on first byte (no JS / font dependency) so a
         slow first load isn't a blank dark screen. Replaced by the app on ready;
         a hard boot failure (e.g. COI) clears body and paints its own banner. */
      #rf-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        height: 100%;
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      #rf-boot .rf-boot__spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-top-color: rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        animation: rf-boot-spin 0.8s linear infinite;
      }
      @keyframes rf-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rf-boot .rf-boot__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="rf-boot" role="status" aria-live="polite">
        <div class="rf-boot__spinner"></div>
        <div>Booting rifty…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
