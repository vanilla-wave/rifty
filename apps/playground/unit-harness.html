<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>rifty browser-unit harness</title>
  </head>
  <body>
    <!--
      Thin browser-unit harness (spike: browser-unit test lane).
      Deliberately does NOT import main.tsx / App.tsx — no Solid render, no #app
      mount, no xterm/monaco, and no duplicate Node runtime owner. Public
      Workbench fixtures receive deployment assets at open; lower-level e2e
      fixtures install their own explicit runtime under the dev server's COI
      headers.
    -->
    <main id="browser-unit-harness" data-status="wiring">rifty browser-unit harness</main>
    <script type="module">
      const el = document.getElementById('browser-unit-harness');
      el.dataset.coi = String(globalThis.crossOriginIsolated === true);
      el.dataset.status = 'ready';
    </script>
  </body>
</html>
