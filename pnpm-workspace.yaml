packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"
  - "services/*"
  - "tests"
  - "examples/*"
# CI/release still uses the exact packageManager pin. Locally, keep compatible
# pnpm 11.x installs usable even when a user-level registry mirror has not
# synced the pinned @pnpm/exe version yet.
pmOnFail: warn
# Dependencies allowed to run install/build scripts (pnpm 11 strictDepBuilds).
# Without an explicit allow, a fresh `pnpm install --frozen-lockfile` fails with
# ERR_PNPM_IGNORED_BUILDS (esbuild/biome ship native postinstalls), which would
# brick every CI job and the release. pnpm manages this `allowBuilds` map; the
# legacy `onlyBuiltDependencies` list is ignored in pnpm 11.
allowBuilds:
  '@biomejs/biome': true
  # Transitive deps of @earendil-works/pi-ai (ADR-0190). Their postinstall
  # codegen is never needed here: the provider SDKs that pull them load only
  # via never-taken lazy chunks (rifty speaks openai-completions only).
  '@google/genai': false
  esbuild: true
  protobufjs: false
